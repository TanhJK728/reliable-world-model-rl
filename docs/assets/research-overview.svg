<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title description">
  <title id="title">Learn. Imagine. Measure.</title>
  <desc id="description">A three-stage continuous-control research workflow. Learn from Pendulum experience with PPO and transition data. Practice inside a five-member learned dynamics ensemble. Compare model and environment returns using the same initial states, the same policy, and 200 steps. Research questions concern prediction error, policy distribution shift, and the return gap.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c34"/>
      <stop offset="1" stop-color="#080f20"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18253d"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b8c8e7" stroke-opacity=".035"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#8191b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="540" rx="24" fill="url(#background)"/>
  <rect width="1280" height="540" rx="24" fill="url(#grid)"/>
  <path d="M54 162H1226" stroke="#8095b7" stroke-opacity=".17"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <circle cx="61" cy="41" r="5" fill="#74e3c5"/>
    <text x="77" y="47" fill="#a8b9d5" font-size="15" font-weight="600" letter-spacing="2.3">WORLD MODELS / CONTINUOUS CONTROL</text>
    <text x="52" y="108" fill="#f1f5fc" font-size="54" font-weight="700" letter-spacing="-1.6">Learn. Imagine. Measure.</text>
    <text x="55" y="141" fill="#afbdd4" font-size="21">How much of a policy’s imagined performance survives in the environment?</text>

    <g>
      <rect x="54" y="189" width="364" height="272" rx="17" fill="url(#card)" stroke="#33415b"/>
      <path d="M74 189H398" stroke="#74e3c5" stroke-width="2" stroke-opacity=".8"/>
      <text x="78" y="226" fill="#74e3c5" font-size="13" font-weight="700" letter-spacing="1.6">01</text>
      <text x="111" y="226" fill="#f0f4fc" font-size="22" font-weight="600">Learn from experience</text>

      <path d="M185 269H247" stroke="#71849e" stroke-width="3" stroke-linecap="round"/>
      <path d="M191 262L185 269M207 262L201 269M223 262L217 269M239 262L233 269" stroke="#53657f" stroke-width="2"/>
      <path d="M216 274V350" stroke="#586b84" stroke-width="1.5" stroke-dasharray="4 5"/>
      <path d="M216 274L268 335" stroke="#74e3c5" stroke-width="5" stroke-linecap="round"/>
      <circle cx="216" cy="274" r="5" fill="#ccece5"/>
      <circle cx="268" cy="335" r="13" fill="#74e3c5"/>
      <circle cx="268" cy="335" r="20" fill="none" stroke="#74e3c5" stroke-opacity=".16" stroke-width="8"/>
      <path d="M216 303A29 29 0 0 0 235 296" fill="none" stroke="#a4b6d0" stroke-width="1.5"/>
      <text x="232" y="322" fill="#a9bcd3" font-size="18" font-style="italic">θ</text>
      <path d="M169 322A54 54 0 0 1 163 285" fill="none" stroke="#74e3c5" stroke-opacity=".65" stroke-width="2"/>
      <path d="M158 291L163 284L169 291" fill="none" stroke="#74e3c5" stroke-opacity=".65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="236" y="395" text-anchor="middle" fill="#e0e9f7" font-size="20" font-weight="500">Physical state → action</text>
      <text x="236" y="425" text-anchor="middle" fill="#9bacc6" font-size="18">PPO + transition data</text>
    </g>

    <path d="M427 324H449" fill="none" stroke="#8191b0" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="458" y="189" width="364" height="272" rx="17" fill="url(#card)" stroke="#33415b"/>
      <path d="M478 189H802" stroke="#aaa8ff" stroke-width="2" stroke-opacity=".8"/>
      <text x="482" y="226" fill="#aaa8ff" font-size="13" font-weight="700" letter-spacing="1.6">02</text>
      <text x="515" y="226" fill="#f0f4fc" font-size="21" font-weight="600">Practice in a world model</text>

      <rect x="587" y="263" width="160" height="65" rx="9" fill="#1d2a47" stroke="#aaa8ff" stroke-opacity=".25"/>
      <rect x="577" y="272" width="160" height="65" rx="9" fill="#202c4d" stroke="#aaa8ff" stroke-opacity=".4"/>
      <rect x="567" y="281" width="160" height="65" rx="9" fill="#253153" stroke="#aaa8ff" stroke-opacity=".55"/>
      <rect x="557" y="290" width="160" height="65" rx="9" fill="#293559" stroke="#aaa8ff" stroke-opacity=".7"/>
      <rect x="547" y="299" width="160" height="65" rx="9" fill="#303c63" stroke="#aaa8ff"/>
      <text x="627" y="339" text-anchor="middle" fill="#e6e5ff" font-size="24" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Δs = f(s, a)</text>
      <rect x="726" y="344" width="48" height="27" rx="13.5" fill="#aaa8ff" fill-opacity=".12"/>
      <text x="750" y="363" text-anchor="middle" fill="#c2c0ff" font-size="15" font-weight="600">× 5</text>

      <text x="640" y="395" text-anchor="middle" fill="#e0e9f7" font-size="20" font-weight="500">Learned dynamics</text>
      <text x="640" y="425" text-anchor="middle" fill="#9bacc6" font-size="18">Imagined rollouts + PPO</text>
    </g>

    <path d="M831 324H853" fill="none" stroke="#8191b0" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="862" y="189" width="364" height="272" rx="17" fill="url(#card)" stroke="#33415b"/>
      <path d="M882 189H1206" stroke="#efc581" stroke-width="2" stroke-opacity=".8"/>
      <text x="886" y="226" fill="#efc581" font-size="13" font-weight="700" letter-spacing="1.6">03</text>
      <text x="919" y="226" fill="#f0f4fc" font-size="22" font-weight="600">Test what transfers</text>

      <circle cx="912" cy="314" r="22" fill="#efc581" fill-opacity=".10" stroke="#efc581" stroke-opacity=".6"/>
      <text x="912" y="321" text-anchor="middle" fill="#f3d8ab" font-size="27" font-family="Georgia, 'Times New Roman', serif" font-style="italic">π</text>
      <path d="M934 314H951V282H977M951 314V346H977" fill="none" stroke="#91a0b8" stroke-width="1.7"/>
      <circle cx="951" cy="314" r="3" fill="#91a0b8"/>
      <rect x="978" y="261" width="223" height="42" rx="8" fill="#252b3e" stroke="#efc581" stroke-opacity=".4"/>
      <text x="1089" y="288" text-anchor="middle" fill="#ead5b4" font-size="18">Model return</text>
      <rect x="978" y="325" width="223" height="42" rx="8" fill="#1d3036" stroke="#74e3c5" stroke-opacity=".4"/>
      <text x="1089" y="352" text-anchor="middle" fill="#bce9dc" font-size="18">Environment return</text>

      <text x="1044" y="395" text-anchor="middle" fill="#e0e9f7" font-size="20" font-weight="500">Same starts. Same policy.</text>
      <text x="1044" y="425" text-anchor="middle" fill="#9bacc6" font-size="18">200 steps in each environment</text>
    </g>

    <g font-size="16" fill="#9eafca">
      <circle cx="170" cy="501" r="3" fill="#74e3c5"/>
      <text x="184" y="507">Prediction error</text>
      <circle cx="539" cy="501" r="3" fill="#aaa8ff"/>
      <text x="553" y="507">Policy distribution shift</text>
      <circle cx="984" cy="501" r="3" fill="#efc581"/>
      <text x="998" y="507">Return gap</text>
    </g>
  </g>
</svg>
